version: '3.8'

# ==============================================================================
# Quanteinstein Enterprise OS · Single-Tenant Air-Gapped VPC Appliance
# Profile: Institutional On-Premise Core (Zero Public Egress / Complete Isolation)
# ==============================================================================

networks:
  enterprise-vpc-airgap:
    driver: bridge
    internal: true # STRICT AIR-GAP: Disallows all outbound internet traffic
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  enterprise_db_data:
    driver: local
  enterprise_shm:
    driver: local
  enterprise_audit_vault:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # C++ Zero-Allocation Matching & FIX Engine (Low-Latency Execution Core)
  # ----------------------------------------------------------------------------
  qe-engine:
    image: quanteinstein/enterprise-engine:latest
    build:
      context: ../..
      dockerfile: deploy/enterprise/Dockerfile.engine
    container_name: qe-enterprise-engine
    restart: always
    cap_add:
      - SYS_NICE        # Required for SCHED_FIFO real-time priority
      - IPC_LOCK        # Required for mlockall / memory pinning
      - SYS_RESOURCE    # Required for unlimited locked memory
    ulimits:
      memlock:
        soft: -1
        hard: -1
      rtprio:
        soft: 99
        hard: 99
    cpuset: "1-3"       # Dedicated isolated CPU cores
    environment:
      - EDITION=enterprise
      - AIR_GAPPED_MODE=true
      - RT_SCHEDULER=SCHED_FIFO
      - RT_PRIORITY=80
      - RT_CORE_ID=1
      - DROPCOPY_ADMIN=CITCO_NAV_DROPCOPY
      - PRIMARY_PB_TARGET=GS_GSET_FIX
    volumes:
      - /dev/shm:/dev/shm
      - enterprise_audit_vault:/var/log/quanteinstein/audit
    networks:
      enterprise-vpc-airgap:
        ipv4_address: 172.28.0.10

  # ----------------------------------------------------------------------------
  # FastAPI Institutional Gateway (Decoupled Enterprise Profile)
  # ----------------------------------------------------------------------------
  qe-api:
    image: quanteinstein/enterprise-api:latest
    build:
      context: ../..
      dockerfile: deploy/enterprise/Dockerfile.api
    container_name: qe-enterprise-api
    restart: always
    depends_on:
      qe-postgres:
        condition: service_healthy
      qe-engine:
        condition: service_started
    environment:
      - EDITION=enterprise
      - AIR_GAPPED_MODE=true
      - SECRET_KEY=enterprise-vault-key-32-byte-secret-token!
      - DATABASE_URL=postgresql+asyncpg://qe_admin:vault_master_pass_9988@qe-postgres:5432/quanteinstein_enterprise
      - REDIS_URL=redis://qe-redis:6379/0
      - FIX_SENDER_COMP_ID=QUANTEINSTEIN_PRIME
      - FIX_TARGET_COMP_ID=GS_GSET_FIX
      - REQUIRE_REG_SHO_LOCATES=true
      - PORT=8000
    volumes:
      - /dev/shm:/dev/shm
      - enterprise_audit_vault:/var/log/quanteinstein/audit
    ports:
      - "8000:8000"
    networks:
      enterprise-vpc-airgap:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Institutional Trading Workstation (Next.js Enterprise Web UI)
  # ----------------------------------------------------------------------------
  qe-workstation:
    image: quanteinstein/enterprise-workstation:latest
    build:
      context: ../..
      dockerfile: deploy/enterprise/Dockerfile.web
    container_name: qe-enterprise-workstation
    restart: always
    depends_on:
      - qe-api
    environment:
      - NEXT_PUBLIC_EDITION=enterprise
      - NEXT_PUBLIC_AIR_GAPPED=true
      - NEXT_PUBLIC_API_URL=http://qe-api:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      enterprise-vpc-airgap:
        ipv4_address: 172.28.0.30

  # ----------------------------------------------------------------------------
  # Secure Internal PostgreSQL 16 (Tenant & Audit Ledger Database)
  # ----------------------------------------------------------------------------
  qe-postgres:
    image: postgres:16-alpine
    container_name: qe-enterprise-postgres
    restart: always
    environment:
      - POSTGRES_DB=quanteinstein_enterprise
      - POSTGRES_USER=qe_admin
      - POSTGRES_PASSWORD=vault_master_pass_9988
    volumes:
      - enterprise_db_data:/var/lib/postgresql/data
    networks:
      enterprise-vpc-airgap:
        ipv4_address: 172.28.0.40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qe_admin -d quanteinstein_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5

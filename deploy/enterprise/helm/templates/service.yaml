apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: qe-enterprise-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: qe-enterprise-api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-workstation
  labels:
    app.kubernetes.io/name: qe-enterprise-workstation
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.workstation.service.type }}
  ports:
    - port: {{ .Values.workstation.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: qe-enterprise-workstation

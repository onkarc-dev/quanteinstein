name: QuantOS Backend Tests

on:
  push:
    branches: [ main, improvements/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      ENV: development
      PRISMFLOW_SECRET_KEY: ci-development-key-with-sufficient-entropy-for-tests
      EMAIL_OTP_DEV_RETURN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install psycopg2-binary rq redis httpx pytest pytest-asyncio

      - name: Run API unit tests
        run: |
          PYTHONPATH=. python -c "from app.db import init_db; init_db()"
          PYTHONPATH=. pytest tests/ -v

      - name: Run root integration and service tests
        run: |
          PYTHONPATH=. pytest ../../tests/ -v --ignore=../../tests/load_test.py
